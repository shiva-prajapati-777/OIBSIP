name: Deploy OIBSIP Websites to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir -p public/LandingPage
          mkdir -p public/PersonalPortfolio
          mkdir -p public/TemperatureConverter
          mkdir -p public/Calculator

          cp -r WebDev-L1-LandingPage/. public/LandingPage/
          cp -r WebDev-L1-PersonalPortfolio/. public/PersonalPortfolio/
          cp -r WebDev-L1-TemperatureConverter/. public/TemperatureConverter/
          cp -r WebDev-L2-Calculator/. public/Calculator/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
