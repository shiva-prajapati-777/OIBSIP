name: Deploy OIBSIP Websites to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir -p public/PersonalPortfolio
          mkdir -p public/TemperatureConverter

          cp -r WebDev-L1-PersonalPortfolio/. public/PersonalPortfolio/
          cp -r WebDev-L1-TemperatureConverter/. public/TemperatureConverter/

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
