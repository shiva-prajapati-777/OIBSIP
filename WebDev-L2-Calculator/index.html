<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaCalc | Level 2 Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <span class="orb orb-one"></span>
        <span class="orb orb-two"></span>
        <span class="orb orb-three"></span>
        <div class="grid-overlay"></div>
    </div>

    <main class="app">

        <!-- Calculator -->
        <section class="calculator-card" id="calculator">

            <header class="top-bar">
                <div class="brand">
                    <div class="brand-icon">N</div>
                    <div>
                        <h1>NovaCalc</h1>
                        <p>SMART CALCULATOR</p>
                    </div>
                </div>

                <div class="live-status">
                    <span class="status-dot"></span>
                    <span>ONLINE</span>
                </div>
            </header>

            <!-- Display -->
            <div class="display" id="display">

                <div class="expression" id="expression">
                    Ready
                </div>

                <div class="result" id="result" aria-live="polite">
                    0
                </div>

                <div class="display-line"></div>

            </div>

            <!-- Mini stats -->
            <div class="mini-stats">
                <div>
                    <span>MODE</span>
                    <strong>STANDARD</strong>
                </div>

                <div>
                    <span>CALCULATIONS</span>
                    <strong id="calculation-count">0</strong>
                </div>
            </div>

            <!-- Calculator buttons -->
            <div class="buttons">

                <button type="button" class="calc-btn utility" data-action="clear" aria-label="Clear calculator">
                    AC
                </button>

                <button type="button" class="calc-btn utility" data-action="backspace" aria-label="Delete last character">
                    ⌫
                </button>

                <button type="button" class="calc-btn operator" data-operation="%" aria-label="Modulus">
                    %
                </button>

                <button type="button" class="calc-btn operator" data-operation="/" aria-label="Divide">
                    ÷
                </button>


                <button type="button" class="calc-btn number" data-number="7">7</button>
                <button type="button" class="calc-btn number" data-number="8">8</button>
                <button type="button" class="calc-btn number" data-number="9">9</button>

                <button type="button" class="calc-btn operator" data-operation="*" aria-label="Multiply">
                    ×
                </button>


                <button type="button" class="calc-btn number" data-number="4">4</button>
                <button type="button" class="calc-btn number" data-number="5">5</button>
                <button type="button" class="calc-btn number" data-number="6">6</button>

                <button type="button" class="calc-btn operator" data-operation="-" aria-label="Subtract">
                    −
                </button>


                <button type="button" class="calc-btn number" data-number="1">1</button>
                <button type="button" class="calc-btn number" data-number="2">2</button>
                <button type="button" class="calc-btn number" data-number="3">3</button>

                <button type="button" class="calc-btn operator" data-operation="+" aria-label="Add">
                    +
                </button>


                <button type="button" class="calc-btn number zero" data-number="0">
                    0
                </button>

                <button type="button" class="calc-btn number" data-number=".">
                    .
                </button>

                <button type="button" class="calc-btn equals" data-action="equals" aria-label="Calculate">
                    =
                </button>

            </div>

            <footer class="calculator-footer">
                <span>Vanilla JavaScript</span>
                <span>LEVEL 02</span>
                <span>NO EVAL()</span>
            </footer>

        </section>


        <!-- History -->
        <aside class="history-card">

            <div class="history-header">
                <div>
                    <p class="history-label">ACTIVITY</p>
                    <h2>Calculation History</h2>
                </div>

                <button type="button" id="clear-history" class="clear-history">
                    Clear
                </button>
            </div>

            <div class="history-list" id="history-list">

                <div class="empty-history" id="empty-history">
                    <div class="history-icon">⌁</div>
                    <h3>No calculations yet</h3>
                    <p>Your recent calculations will appear here.</p>
                </div>

            </div>

        </aside>

    </main>

    <div class="toast" id="toast">
        <span class="toast-icon">✓</span>
        <span id="toast-message">Ready</span>
    </div>

    <script src="script.js"></script>

</body>

</html>
